</style></head><body><header><div><h1>🥒 Pickle · Rack Mode</h1><span style="color:var(--green);font-weight:800;font-size:13px">PICK ONLY</span></div></header><main>

"picked":0},{"sku":"5025615","upc":"74198100507","description":"DIAM 50LB HI-ENERGY","qty":3,"picked":0},{"sku":"5006970","upc":"17800134606","description":"BNFL 28LB HLTH WT","qty":1,"picked":0},{"sku":"1165020","upc":"17800149273","description":"ONE 31.1LB SS&S","qty":1,"picked":0},{"sku":"1231675","upc":"17800149358","description":"ONE 16.5LB PUPPY","qty":1,"picked":0},{"sku":"1278164","upc":"17800179348","description":"ONE 40LB LG BRD","qty":2,"picked":0},{"sku":"1231678","upc":"17800167468","description":"ONE 40LB L&R","qty":1,"picked":0},{"sku":"1231677","upc":"17800171410","description":"ONE 36LB TI TKY&VEN","qty":1,"picked":0},{"sku":"1460455","upc":"17800178709","description":"ONE 36LB TI SMN&TNA","qty":1,"picked":0},{"sku":"1231676","upc":"17800149303","description":"ONE 31.1LB B&R SM BTS","qty":1,"picked":0},{"sku":"1046252","upc":"17800149402","description":"ONE 16.5LB L&R","qty":1,"picked":0},{"sku":"6041641","upc":"11132100360","description":"ALPO 45LB PRIME CUTS","qty":1,"picked":0},{"sku":"6041642","upc":"50000637409","description":"ALPO 45LB CMN GET IT","qty":1,"picked":0},{"sku":"2053330","upc":"17800100335","description":"DOG CHOW 44LB LAMB","qty":1,"picked":0},{"sku":"2053268","upc":"17800100311","description":"DOG CHOW 44LB CHK","qty":1,"picked":0},{"sku":"2095951","upc":"17800100441","description":"PUPPY CHOW 30LB","qty":1,"picked":0},{"sku":"2053269","upc":"17800100328","description":"DOG CHOW 44LB BF","qty":1,"picked":0},{"sku":"1872854","upc":"23100143620","description":"PDGR 30LB PUPPY","qty":2,"picked":0},{"sku":"6043564","upc":"23100143330","description":"PDGR ADL HI PRO RM 40 LB","qty":4,"picked":0},{"sku":"5900394","upc":"79100739509","description":"KNB 16LB MINIBITS BF&CHK","qty":1,"picked":0}];const KEY='pickle_rack_only_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.rows))state={name:'October 13 dog pick list (preloaded)',rows:SAMPLE};let filter={animal:'ALL',brand:'ALL',min:0,max:60,search:''};let selected=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('message').textContent='Browser storage unavailable; keep this tab open.'}};
const brandMap={'SD':'Science Diet','PPLN':'Purina Pro Plan','WHLSM':'Wholesomes','VICTOR':'Victor','SPMX':'Sportmix','BB':'Blue Buffalo','FAS':'Fromm','TOTW':'Taste of the Wild','4HLTH':'4health','DM NAT':'Diamond Naturals','DIAM':'Diamond','BNFL':'Beneful','ONE':'Purina ONE','ALPO':'Alpo','DOG CHOW':'Dog Chow','PUPPY CHOW':'Puppy Chow','PDGR':'Pedigree','KNB':'Kibbles n Bits','PUR':'Purina','DMR':'Dumor','NUT':'Nutrena','NBO':'Nature’s Best','RW':'Royal Wing','TIDY CATS':'Tidy Cats','A&H':'Arm & Hammer','P&C':'Paws & Claws'};
function brand(d){d=d.toUpperCase().trim();let k=Object.keys(brandMap).sort((a,b)=>b.length-a.length).find(k=>d===k||d.startsWith(k+' '));return k?brandMap[k]:d.split(' ')[0]||'Other'}
function weight(d){let m=d.match(/(\d+(?:\.\d+)?)\s*LB\b/i);return m?+m[1]:null}
function animal(d){let s=d.toUpperCase();if(/\b(CATTLE|CALF|GOAT|SHEEP|HOG|PIG|HORSE|EQUINE|RABBIT|SWINE|LAYER|FLOCK|CHICKEN FEED|CHICK STARTER)\b/.test(s))return 'LIVESTOCK';if(/\b(CAT|KITTEN|FRSK|MMIX|KTNKBD|LITTER|TIDY CATS)\b/.test(s))return 'CAT';if(/\b(BIRD|SUNFLOWER|SEED)\b/.test(s))return 'BIRD';return 'DOG'}
function remain(r){return Math.max(0,r.qty-r.picked)}
function options(el,values,all,label){let old=el.id==='animal'?filter.animal:filter.brand;el.innerHTML='<option value="ALL">'+all+'</option>'+values.map(v=>'<option value="'+v.replaceAll('"','&quot;')+'">'+v.replaceAll('<','&lt;')+'</option>').join('');el.value=values.includes(old)?old:'ALL';return el.value}
function render(){let active=state.rows.filter(r=>remain(r)>0);$('fileName').textContent=state.name+' · '+state.rows.length+' products';$('items').textContent=active.length;$('bags').textContent=active.reduce((a,r)=>a+remain(r),0);$('complete').textContent=state.rows.filter(r=>r.qty>0&&!remain(r)).length;let types=[...new Set(active.map(r=>animal(r.description)))].sort();filter.animal=options($('animal'),types,'ALL TYPES');let typeRows=active.filter(r=>filter.animal==='ALL'||animal(r.description)===filter.animal);let brands=[...new Set(typeRows.map(r=>brand(r.description)))].sort();filter.brand=options($('brand'),brands,'ALL BRANDS');$('min').value=filter.min;$('max').value=filter.max;$('minText').textContent=filter.min+' LB';$('maxText').textContent=filter.max===60?'60+ LB':filter.max+' LB';let shown=typeRows.filter(r=>(filter.brand==='ALL'||brand(r.description)===filter.brand)&&(weight(r.description)===null?(filter.min===0&&filter.max===60):(weight(r.description)>=filter.min&&weight(r.description)<=filter.max))&&(!filter.search||(r.description+' '+r.sku).toLowerCase().includes(filter.search)));shown.sort((a,b)=>brand(a.description).localeCompare(brand(b.description))||(weight(a.description)??999)-(weight(b.description)??999)||a.description.localeCompare(b.description));$('shown').textContent=shown.length+' products · '+shown.reduce((a,r)=>a+remain(r),0)+' bags to pick';let out='',last='';for(let r of shown){let b=brand(r.description);if(b!==last){out+='<div class="group">'+escapeHTML(b)+'</div>';last=b}out+='<button class="product" data-sku="'+r.sku+'"><div class="desc">'+escapeHTML(r.description)+'<div class="meta">SKU '+r.sku+' · '+(weight(r.description)??'?')+' LB · '+r.picked+' picked of '+r.qty+'</div></div><div class="qty">'+remain(r)+'</div></button>'} $('list').innerHTML=out||'<div class="card muted">No remaining products match these filters.</div>';document.querySelectorAll('[data-sku]').forEach(b=>b.onclick=()=>open(b.dataset.sku));}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function open(sku){selected=state.rows.find(r=>r.sku===sku);if(!selected)return;$('modalTitle').textContent=selected.description;$('modalDetail').textContent='SKU '+sku+' · '+remain(selected)+' remaining · '+selected.picked+' already picked';$('numbers').innerHTML='';for(let n=1;n<=Math.min(12,remain(selected));n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>{selected.picked+=n;save();$('modal').classList.remove('open');render()};$('numbers').append(b)}$('undo').disabled=selected.picked===0;$('modal').classList.add('open')}
$('close').onclick=()=>$('modal').classList.remove('open');$('undo').onclick=()=>{if(selected&&selected.picked){selected.picked--;save();$('modal').classList.remove('open');render()}};
$('animal').onchange=()=>{filter.animal=$('animal').value;filter.brand='ALL';render()};$('brand').onchange=()=>{filter.brand=$('brand').value;render()};$('min').oninput=()=>{filter.min=+$('min').value;if(filter.min>filter.max)filter.max=filter.min;render()};$('max').oninput=()=>{filter.max=+$('max').value;if(filter.max<filter.min)filter.min=filter.max;render()};$('allWeights').onclick=()=>{filter.min=0;filter.max=60;render()};$('search').oninput=()=>{filter.search=$('search').value.trim().toLowerCase();render()};$('reset').onclick=()=>{if(confirm('Reset picked counts for every product?')){state.rows.forEach(r=>r.picked=0);save();render()}};$('clear').onclick=()=>{if(confirm('Clear the active pick list?')){state={name:'No pick list',rows:[]};save();render()}};
async function parsePDF(file){if(!window.pdfjsLib)throw Error('PDF library could not load. Connect to the internet and try again.');let pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let rows=[];for(let page=1;page<=pdf.numPages;page++){let p=await pdf.getPage(page),items=(await p.getTextContent()).items.filter(x=>x.str.trim());let lines=new Map();for(let x of items){let y=Math.round(x.transform[5]*2)/2;if(!lines.has(y))lines.set(y,[]);lines.get(y).push(x)}for(let pieces of lines.values()){pieces.sort((a,b)=>a.transform[4]-b.transform[4]);let line=pieces.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim();let m=line.match(/^(\d{7})\s+(\d{8,14})\s+(.+?)\s+(\S+)\s+(-?\d+\.\d{1,3})\s+(\d+\.\d{1,3})$/);if(!m)continue;let qty=Number(m[6]);if(!Number.isInteger(qty)||qty<0||qty>99)continue;rows.push({sku:m[1],upc:m[2],description:m[3].trim(),qty,picked:0})}}return rows}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('message').textContent='Reading PDF…';try{let rows=await parsePDF(f);if(!rows.length)throw Error('No valid rows found. The current list has not been replaced.');let unique=new Map();rows.forEach(r=>{if(unique.has(r.sku))unique.get(r.sku).qty+=r.qty;else unique.set(r.sku,r)});state={name:f.name,rows:[...unique.values()]};filter={animal:'ALL',brand:'ALL',min:0,max:60,search:''};$('search').value='';save();render();$('message').textContent='✓ Loaded '+state.rows.length+' items, '+state.rows.reduce((a,r)=>a+r.qty,0)+' bags.'}catch(err){$('message').textContent='PDF error: '+err.message}};save();render();
